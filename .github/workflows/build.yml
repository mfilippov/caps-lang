name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            vcvars: amd64
          - arch: arm64
            vcvars: amd64_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
          cl capslang.c /Fe:capslang-${{ matrix.arch }}.exe /link user32.lib /SUBSYSTEM:WINDOWS

      - uses: actions/upload-artifact@v4
        with:
          name: capslang-${{ matrix.arch }}
          path: capslang-${{ matrix.arch }}.exe
