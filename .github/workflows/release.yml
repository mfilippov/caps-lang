name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # build provenance (Sigstore)
      attestations: write
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            vcvars: amd64
          - arch: arm64
            vcvars: amd64_arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        # vswhere instead of a fixed path: the Visual Studio version on windows-latest changes.
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} || exit /b 1
          cl capslang.c /Fe:capslang-${{ matrix.arch }}.exe /link user32.lib /SUBSYSTEM:WINDOWS

      # Shown on the run page (Summary) to compare with the sign-pending screen.
      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash capslang-${{ matrix.arch }}.exe -Algorithm SHA256).Hash.ToLower()
          "capslang-${{ matrix.arch }}.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      # sign-pending on badger refuses to sign a file without this provenance (built by this
      # workflow, at this tag and commit, on a GitHub-hosted runner).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: capslang-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.arch }}
          path: capslang-${{ matrix.arch }}.exe

  # One artifact → one signing request → one PIN for both architectures.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned
          pattern: unsigned-*
          delete-merged: true

  # Runs on badger (github-codesign): drops a request into the spool and waits until the
  # signature is approved with sign-pending.
  sign:
    needs: merge
    runs-on: codesign
    # Required reviewer + only v* tags; the job does not reach the runner before approval.
    environment: codesign
    timeout-minutes: 60
    steps:
      - name: Request signature
        run: |
          id="caps-lang-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '{"repo":"%s","run_id":%s,"run_attempt":%s,"artifact":"unsigned"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"/spool/requests/.$id.tmp"
          mv "/spool/requests/.$id.tmp" "/spool/requests/$id.json"
          echo "Waiting for approval: sudo -u signer sign-pending"
          until [ -f "/spool/results/$id/status.json" ]; do sleep 10; done
          cat "/spool/results/$id/status.json"
          grep -q '"status": "signed"' "/spool/results/$id/status.json"
          # The runner is persistent and this job has no checkout, so the workspace is not
          # cleaned between runs; RUNNER_TEMP is emptied by the runner before every job.
          out="$RUNNER_TEMP/signed"
          rm -rf "$out" && mkdir "$out"
          cp "/spool/results/$id"/*.exe "$out"/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: ${{ runner.temp }}/signed/*.exe
          if-no-files-found: error

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            Caps Lang.xml
            install.cmd
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned
          path: unsigned

      # The signed files came back through the self-hosted codesign runner. Before attesting
      # and releasing them, prove they are exactly the attested GitHub-hosted build plus a
      # valid signature by us: unsigned build has provenance, signature verifies, and the
      # signed file without its signature (PE CheckSum zeroed, it is recomputed on signing
      # and not covered by Authenticode) is byte-identical to the unsigned build.
      - name: Check signed files against the attested build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq osslsigncode >/dev/null
          ca=/etc/ssl/certs/ca-certificates.crt
          for f in capslang-*.exe; do
            gh attestation verify "unsigned/$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners >/dev/null
            osslsigncode verify -in "$f" -CAfile "$ca" -TSA-CAfile "$ca" >verify.txt
            grep -q 'Subject: CN=Mikhail Filippov,' verify.txt
            osslsigncode remove-signature -in "$f" -out "$RUNNER_TEMP/stripped.exe" >/dev/null
            python3 - "$RUNNER_TEMP/stripped.exe" "unsigned/$f" <<'PY'
          import hashlib, struct, sys
          def digest(path):
              b = bytearray(open(path, "rb").read())
              off = struct.unpack_from("<I", b, 0x3C)[0] + 0x58  # PE CheckSum
              b[off:off + 4] = bytes(4)
              return hashlib.sha256(b).hexdigest()
          a, b = digest(sys.argv[1]), digest(sys.argv[2])
          if a != b:
              sys.exit(f"signed file does not match the attested build: {a} != {b}")
          PY
            rm -f "$RUNNER_TEMP/stripped.exe" verify.txt
            echo "✓ $f"
          done

      # Provenance for the released (signed) files, so users can run
      # `gh attestation verify capslang-x64.exe --repo mfilippov/caps-lang`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: capslang-*.exe

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Caps Lang.xml" capslang-task.xml
          cat >notes.md <<'NOTES'
          ## Install

          Download `install.cmd`, `capslang-task.xml` and the exe for your machine
          (`capslang-x64.exe` or `capslang-arm64.exe`) into one folder and run `install.cmd`.
          It checks the signature, copies the exe to `C:\ProgramData\caps-lang\capslang.exe`,
          registers the "Caps Lang" logon task (replacing an existing one) and starts it.

          The executables are Authenticode-signed by Mikhail Filippov and have GitHub build
          provenance: `gh attestation verify capslang-x64.exe --repo mfilippov/caps-lang`
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            capslang-*.exe capslang-task.xml install.cmd
