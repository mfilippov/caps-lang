name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # build provenance (Sigstore)
      attestations: write
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            vcvars: amd64
          - arch: arm64
            vcvars: amd64_arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        # vswhere instead of a fixed path: the Visual Studio version on windows-latest changes.
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} || exit /b 1
          cl capslang.c /Fe:capslang-${{ matrix.arch }}.exe /link user32.lib /SUBSYSTEM:WINDOWS

      # Shown on the run page (Summary) to compare with the sign-pending screen.
      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash capslang-${{ matrix.arch }}.exe -Algorithm SHA256).Hash.ToLower()
          "capslang-${{ matrix.arch }}.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      # sign-pending on badger refuses to sign a file without this provenance (built by this
      # workflow, at this tag and commit, on a GitHub-hosted runner).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: capslang-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.arch }}
          path: capslang-${{ matrix.arch }}.exe

  # One artifact → one signing request → one PIN for both architectures.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          pattern: unsigned-*
          delete-merged: true

  # Runs on the codesign runner on badger (mfilippov/github-codesign): submits a signing
  # request and waits until it is approved with sign-pending.
  sign:
    needs: merge
    runs-on: codesign
    # Required reviewer + only v* tags; the job does not reach the runner before approval.
    environment: codesign
    timeout-minutes: 60
    steps:
      - id: sign
        uses: mfilippov/github-codesign/request-signature@d17bdb1b5f08fbcbec5f4d687a3fba5c8c476038 # main
        with:
          artifact: unsigned

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed
          path: ${{ steps.sign.outputs.dir }}
          if-no-files-found: error

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Caps Lang.xml
            install.cmd
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: signed

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned
          path: unsigned

      # The signed files came back through the self-hosted runner: prove they are the attested
      # GitHub-hosted build plus a valid signature by the pinned certificate.
      - uses: mfilippov/github-codesign/verify-signed@d17bdb1b5f08fbcbec5f4d687a3fba5c8c476038 # main
        with:
          signed: signed
          unsigned: unsigned

      # Provenance for the released (signed) files, so users can run
      # `gh attestation verify capslang-x64.exe --repo mfilippov/caps-lang`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: signed/capslang-*.exe

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Caps Lang.xml" capslang-task.xml
          cat >notes.md <<'NOTES'
          ## Install

          Download `install.cmd`, `capslang-task.xml` and the exe for your machine
          (`capslang-x64.exe` or `capslang-arm64.exe`) into one folder and run `install.cmd`.
          It checks the signature, copies the exe to `C:\ProgramData\caps-lang\capslang.exe`,
          registers the "Caps Lang" logon task (replacing an existing one) and starts it.

          The executables are Authenticode-signed by Mikhail Filippov and have GitHub build
          provenance: `gh attestation verify capslang-x64.exe --repo mfilippov/caps-lang`
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            signed/capslang-*.exe capslang-task.xml install.cmd
