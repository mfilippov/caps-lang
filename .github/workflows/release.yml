name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            vcvars: amd64
          - arch: arm64
            vcvars: amd64_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        # vswhere instead of a fixed path: the Visual Studio version on windows-latest changes.
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} || exit /b 1
          cl capslang.c /Fe:capslang-${{ matrix.arch }}.exe /link user32.lib /SUBSYSTEM:WINDOWS

      # Shown on the run page (Summary) to compare with the sign-pending screen.
      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash capslang-${{ matrix.arch }}.exe -Algorithm SHA256).Hash.ToLower()
          "capslang-${{ matrix.arch }}.exe: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.arch }}
          path: capslang-${{ matrix.arch }}.exe

  # One artifact → one signing request → one PIN for both architectures.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: unsigned
          pattern: unsigned-*
          delete-merged: true

  # Runs on badger (github-codesign): drops a request into the spool and waits until the
  # signature is approved with sign-pending.
  sign:
    needs: merge
    runs-on: codesign
    # Required reviewer + only v* tags; the job does not reach the runner before approval.
    environment: codesign
    timeout-minutes: 60
    steps:
      - name: Request signature
        run: |
          id="caps-lang-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '{"repo":"%s","run_id":%s,"run_attempt":%s,"artifact":"unsigned"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"/spool/requests/.$id.tmp"
          mv "/spool/requests/.$id.tmp" "/spool/requests/$id.json"
          echo "Waiting for approval: sudo -u signer sign-pending"
          until [ -f "/spool/results/$id/status.json" ]; do sleep 10; done
          cat "/spool/results/$id/status.json"
          grep -q '"status": "signed"' "/spool/results/$id/status.json"
          mkdir signed
          cp "/spool/results/$id"/*.exe signed/

      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: signed/*.exe
          if-no-files-found: error

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: capslang-task.xml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: signed

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >notes.md <<'NOTES'
          ## Install

          1. Download `capslang-x64.exe` or `capslang-arm64.exe` and save it as
             `C:\ProgramData\caps-lang\capslang.exe`.
          2. Download `capslang-task.xml` and register the logon task:
             `schtasks /create /xml capslang-task.xml /tn "Caps Lang"`
          3. Sign out and back in, or start it now: `schtasks /run /tn "Caps Lang"`

          The executables are Authenticode-signed by Mikhail Filippov.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            capslang-*.exe capslang-task.xml
